name: Audit cask
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/jiraffekiller"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/jiraffekiller/homebrew-tap"
      - run: brew style jiraffekiller/tap
      - run: brew audit --cask --online jiraffekiller/tap/sail
      - run: brew fetch --cask jiraffekiller/tap/sail
